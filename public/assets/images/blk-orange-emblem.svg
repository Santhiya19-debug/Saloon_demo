<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Outer circle -->
  <circle cx="30" cy="30" r="27.5" stroke="#161514" stroke-width="1.5"/>

  <!-- Left scissor blade: top-right to lower-left -->
  <line x1="39.5" y1="11" x2="18.5" y2="52" stroke="#161514" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Right scissor blade: top-left to lower-right -->
  <line x1="20.5" y1="11" x2="41.5" y2="52" stroke="#161514" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Left handle ring -->
  <circle cx="16.5" cy="53" r="5.2" stroke="#161514" stroke-width="1.8" fill="none"/>

  <!-- Right handle ring -->
  <circle cx="43.5" cy="53" r="5.2" stroke="#161514" stroke-width="1.8" fill="none"/>

  <!-- Pivot point (where blades cross) -->
  <circle cx="30" cy="31.5" r="3" fill="#161514"/>
  <circle cx="30" cy="31.5" r="1.4" fill="#FAF7F2"/>
</svg>
