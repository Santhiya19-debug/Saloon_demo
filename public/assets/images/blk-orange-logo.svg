<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ── Circular emblem ── -->
  <circle cx="34" cy="36" r="32" stroke="#161514" stroke-width="1.6"/>

  <!-- Left blade -->
  <line x1="44" y1="13" x2="22" y2="61" stroke="#161514" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right blade -->
  <line x1="24" y1="13" x2="46" y2="61" stroke="#161514" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left handle ring -->
  <circle cx="20" cy="62.5" r="5.8" stroke="#161514" stroke-width="1.8" fill="none"/>
  <!-- Right handle ring -->
  <circle cx="46" cy="62.5" r="5.8" stroke="#161514" stroke-width="1.8" fill="none"/>

  <!-- Pivot -->
  <circle cx="34" cy="37" r="3.2" fill="#161514"/>
  <circle cx="34" cy="37" r="1.5" fill="#FAF7F2"/>

  <!-- ── Wordmark ── -->
  <!-- "BLK" -->
  <text x="80" y="39"
    font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="2"
    fill="#161514">BLK</text>

  <!-- "ORANGE" -->
  <text x="130" y="39"
    font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="2"
    fill="#D9531E"> ORANGE</text>

  <!-- Tagline -->
  <text x="80" y="57"
    font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif"
    font-size="8"
    font-weight="500"
    letter-spacing="4.2"
    fill="#7a736d">SALON &amp; BEAUTY STUDIO</text>
</svg>
